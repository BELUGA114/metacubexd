name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    outputs:
      # release-please sets release_created to the STRING "false" when no release
      # is cut; GitHub Actions treats a non-empty string as truthy in `if:`, so
      # normalize to "true"/"" to gate the downstream jobs correctly.
      release_created: ${{ steps.release.outputs.release_created == 'true' && 'true' || '' }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: latest

      - name: install dependencies
        run: pnpm install

      # Relative base URL so the static output works when served from any path
      # (a reverse proxy sub-path, or mihomo's local external-ui directory).
      - name: build
        run: NUXT_APP_BASE_URL='./' pnpm --filter @metacubexd/ui generate

      - name: compress dist
        run: tar czvf compressed-dist.tgz -C packages/ui/.output/public .

      - name: attach github release artifacts
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: compressed-dist.tgz
          tag_name: ${{ needs.release-please.outputs.tag_name }}
